# MilterGuard: https://github.com/PhilAnderson1/MilterGuard
#
# This example configuration and the supplied detection prompt have been tuned
# and tested with Qwen3.6-35B-A3B. Other LLMs may require adjustments to the
# prompt, rejection threshold, timeout, or reasoning settings.
#
# Important: preserve the supplied two-space YAML indentation and do not use tabs.

# Operation mode: monitor, tag, or enforce.
# monitor logs proposed decisions but always accepts mail.
# tag accepts all mail and adds MilterGuard result headers.
# enforce can reject unwanted decisions according to policy below.
mode: monitor

milter:
  # Listener address. The default is a loopback-only TCP listener. Change the
  # port if it conflicts locally; do not expose it on a public interface.
  # A Unix socket may be used instead: unix:/run/milterguard/milterguard.sock
  socket: tcp:127.0.0.1:8895

  # Milter protocol I/O timeout. Uses Go duration syntax, for example 30s,
  # 2m, or 1m30s.
  timeout: 1m

  # Maximum time for DNS lookups (DNS evidence is used by the AI to classify emails).
  connection_dns_timeout: 5s

  # Maximum email size retained for analysis, in bytes; positive integer.
  # Larger messages are truncated and the decision log records truncated=true.
  max_message_size: 10485760

ai:
  # Full OpenRouter, OpenAI or llama.cpp-compatible chat-completions URL.
  # The endpoint must implement the v1/chat/completions request and response format.
  # To use OpenRouter, create an account and API key at https://openrouter.ai/.
  endpoint: https://openrouter.ai/api/v1/chat/completions

  # Endpoint request type: openrouter, llamacpp, or openai. This selects the
  # provider-specific control used by disable_thinking.
  endpoint_type: openrouter

  # API credential. For a local endpoint that does not authenticate, a
  # non-empty placeholder is still required and is sent as a Bearer token.
  api_key: "replace-with-your-openrouter-key"

  # Alternatively, set api_key: "" and name an environment variable here.
  # The variable must be available to the MilterGuard service process.
  # api_key_env: OPENROUTER_API_KEY

  # Model identifier accepted by the endpoint. OpenRouter commonly uses
  # provider/model names; llama.cpp may use its configured model name or path.
  model: qwen/qwen3.6-35b-a3b

  # Boolean: true or false. It is recommended to keep thinking turned off
  # to minimize response time.
  disable_thinking: true

  # Absolute path to the system prompt used for every classification.
  prompt_file: /etc/milterguard/detection-prompt.txt

  # Maximum duration of one AI request, using Go duration syntax. Must be > 0.
  timeout: 45s

  # Retry connection failures or malformed AI responses this many times.
  retries: 1

  # Maximum number of simultaneous AI analyses; positive integer.
  max_concurrent: 8

  # Maximum number of message-text characters supplied to the AI; positive
  # integer. This is separate from milter.max_message_size, which is in bytes.
  max_body_chars: 50000

  # Image analysis detects scams concealed in images to evade text-based filtering.
  # Modes: off, fallback, or always. fallback analyses inline images only when
  # insufficient body text is available. Requires a vision-capable AI model.
  vision_mode: fallback
  vision_min_text_chars: 200

  # Limits the number, file size, and dimensions of embedded images sent for
  # analysis. Remote images are never downloaded.
  max_images: 2
  max_image_bytes: 2097152
  max_image_pixels: 12000000

  # Optional OpenRouter attribution headers. Empty strings disable them.
  # site_url is sent as HTTP-Referer; app_name is sent as X-Title.
  site_url: https://github.com/PhilAnderson1/MilterGuard
  app_name: MilterGuard

filtering:
  # Reject unwanted classifications at or above this confidence score (0-1).
  reject_score: 0.9

  # Mark legitimate classifications below this score as low confidence (0-1).
  legitimate_low_confidence_score: 0.8

  # Add classification, confidence, score, and action headers to accepted email.
  # Unwanted and legitimate classifications use their respective thresholds.
  add_email_headers: true

  # Scan email sent by authenticated users. Set to true to enable attachment
  # and AI scanning of outbound mail.
  scan_authenticated: false

  # File containing trusted visible From domains that bypass AI scanning.
  # List one exact domain per line; entries also match their subdomains.
  sender_domain_allowlist: /etc/milterguard/trusted-sender-domains.txt

  # Require trusted, aligned DKIM authentication for the domain bypass.
  sender_domain_allowlist_require_dkim: true

  # Action when AI analysis fails: accept or tempfail. tempfail asks the sending
  # mail server to retry later. Monitor mode always accepts.
  ai_error_action: accept

  # Text returned with SMTP status 550 5.7.1 when a message is rejected.
  # Keep this on one line; NUL and newline characters are removed.
  reject_message: Message rejected as suspected spam or fraud

attachments:
  # Block executable attachments before AI analysis.
  block_executables: true

  # Filename extensions to block, including inside supported archives.
  blocked_extensions:
    - exe
    - com
    - scr
    - pif
    - bat
    - cmd
    - ps1
    - vbs
    - js
    - jse
    - msi
    - dll
    - jar
    - lnk
    - iso
    # 7z and RAR archives are blocked because MilterGuard cannot decompress
    # and inspect their contents, not because the formats are executable.
    - 7z
    - rar

  # Detect Windows PE, ELF, Mach-O, and executable script signatures even when
  # the filename extension has been disguised.
  inspect_file_signatures: true

  # Inspect the contents of ZIP, TAR, GZIP, and BZIP2 attachments.
  inspect_archives: true

  # Safety limits for attachments and decompressed archive contents.
  max_attachment_bytes: 10485760
  archive_max_depth: 2
  archive_max_files: 100
  archive_max_uncompressed_bytes: 52428800

  # Action for encrypted archives and content that cannot be fully inspected:
  # accept, reject, or tempfail. Monitor mode always accepts.
  encrypted_archive_action: reject
  unscannable_action: accept

  # Text returned with SMTP status 550 5.7.1 when attachment policy rejects mail.
  reject_message: Message rejected because it contains a prohibited executable attachment

email_commands:
  # Process commands sent by authenticated users. Disabled by default. Replace
  # example.com with your mail domain, then add this fallback to /etc/aliases:
  # milterguard: /dev/null
  enabled: false
  recipient: milterguard@example.com

  # SASL login identities with permission to manage any local address and use
  # wildcard deletion. Values are matched case-insensitively. [] means no
  # administrators. To add administrators, replace it with:
  # administrators:
  #   - admin_login
  #   - another_admin
  administrators: []

  # Permit normal authenticated users to manage entries for their own verified
  # envelope-sender address.
  allow_authenticated_users: false

  # Verify that an authenticated user's envelope sender resolves exclusively to
  # their SASL identity through simple local aliases.
  verify_sender_via_aliases: true
  aliases_file: /etc/aliases

  # If alias verification is disabled, Postfix must enforce sender ownership
  # with smtpd_sender_login_maps. Without either check, an authenticated user
  # could modify another local user's allowlist.

  # Send a reply confirmation email when a command email is received.
  send_replies: true
  # SMTP server used to send command results. Include the port.
  smtp_host: 127.0.0.1:25

  # Maximum decoded command-message size. Plain-text and HTML commands are
  # accepted; attachments are not.
  max_message_bytes: 8192

rejection_history:
  # Retain AI-rejected sender, recipient, time, and reason records for this duration.
  # Uses Go duration syntax; 0s disables rejection history.
  expiry: 720h

  # Persistent rejection history file
  file: /var/lib/milterguard/rejection-history.json

  # Maximum retained rejection records. The oldest records are removed first.
  max_entries: 10000

rejected_mail:
  # Save copies of messages rejected after complete-message inspection.
  # IP reputation rejections occur before the message is received and cannot
  # be saved. Stored email may contain private data and malicious attachments.
  enabled: false

  # Messages are stored as YYYY/MM/DD/*.eml beneath this directory.
  directory: /var/lib/milterguard/rejected-mail

  # Remove expired messages at startup and every 24 hours.
  retention: 720h

  # Storage limits. The oldest retained messages are removed first when needed.
  max_messages: 10000
  max_total_bytes: 5368709120

ip_reputation:
  # Temporarily blacklist the sending IP after rejecting an email, avoiding further
  # AI requests. Uses Go duration syntax; 0s disables.
  block_duration: 60m

  # Rejections within the rolling window required for longer IP blacklisting.
  # Set to 0 to disable escalation.
  repeat_threshold: 3
  repeat_window: 720h
  repeat_block_duration: 720h

  # Extend the repeat-offender blacklisting timeout after each delivery attempt.
  repeat_refresh_on_attempt: true

  # Legitimate emails required to remove one IP strike. Set to 0 to disable.
  legitimate_messages_per_strike: 3

  # Maximum stored sending IP records; positive integer.
  max_entries: 10000

  # Persistent reputation state. Strikes and active blocks survive restarts.
  state_file: /var/lib/milterguard/rejected-ip-state.json

  # Exact IP addresses or CIDR ranges that must never be added to the rejection
  # cache. Add trusted relays and shared forwarding services here as needed.
  ip_allowlist:
    - 127.0.0.0/8
    - ::1/128

  # Never blacklist IPs with forward-confirmed reverse DNS matching these domains
  # or their subdomains.
  domain_allowlist:
    - google.com
    - outlook.com
    - yahoo.com
    - yahoo.net
    - me.com
    - icloud.com
    - messagingengine.com
    - protonmail.ch
    - zoho.com
    - zohomail.com
    - gmx.net
    - web.de

correspondents:
  # Automatically whitelist external addresses that authenticated local users
  # send email to.
  learn_authenticated_recipients: true

  # Automatically add consistently legitimate inbound senders to the allowlist.
  learn_legitimate_senders: true

  # Number of legitimate emails required to allowlist an inbound sender, and the
  # minimum confidence score each email must meet.
  legitimate_sender_min_messages: 3
  legitimate_sender_min_score: 0.95

  # Boolean: require trusted aligned DKIM before an inbound legitimate result
  # contributes toward automatic whitelisting.
  legitimate_sender_require_dkim: true

  # Boolean: use saved relationships when assessing inbound mail. When false,
  # the database may still be populated for inspection without affecting mail.
  use_allowlist: true

  # per_sender keeps each local user's correspondents separate. global uses
  # known correspondents from all local users.
  scope: per_sender

  # For per_sender scope, require all envelope recipients to recognise the
  # correspondent, or any to require only one. all is safer for shared servers.
  recipient_match: all

  # Boolean: bypass AI email scanning when recipient_match and any configured
  # authentication requirements are satisfied. When false, the relationship
  # is supplied to the AI as supporting evidence.
  bypass_ai: true

  # Require trusted, aligned DKIM authentication before a known correspondent can
  # bypass AI. Disable to permit bypass without authentication.
  require_dkim_for_bypass: true

  # Runtime-generated state file and maximum number of retained relationships.
  file: /var/lib/milterguard/correspondent-allowlist.json
  max_entries: 10000

  # Remove relationships with no qualifying inbound or outbound activity for
  # this duration. 0s disables age-based expiry.
  stale_after: 8760h

  # Minimum interval between saving activity updates for each relationship.
  # Set to 0s to save every qualifying activity.
  activity_update_interval: 24h

  # Identifies Authentication-Results headers added by your own mail server, allowing
  # MilterGuard to trust their DKIM results. $mta_hostname automatically uses
  # your MTA hostname. Your MTA must remove forged inbound Authentication-Results
  # headers claiming this hostname.
  trusted_authserv_ids:
    - "$mta_hostname"

persistence:
  # How often changed runtime databases are written to disk. Uses Go duration
  # syntax. 0s writes every change immediately.
  flush_interval: 1m

logging:
  # Minimum log level: debug, info, warn, or error.
  level: info

  # Include email subjects in successful decision logs.
  include_subject: true

  # Log complete AI input for troubleshooting. This may expose sensitive email
  # content, so enable it only temporarily. Image data is never logged.
  include_ai_input: false
